# Force the fbdev driver on the virtio-gpu emulated framebuffer.
# (modesetting would need glamor/mesa3d; fbdev is lean and reliable under QEMU)
Section "Device"
    Identifier  "virtio-gpu"
    Driver      "fbdev"
EndSection

Section "Screen"
    Identifier  "Screen0"
    Device      "virtio-gpu"
    DefaultDepth 24
EndSection
